[workspace]
resolver = "3"
members = [
  "bins/wudangd",
  "bins/wudangd-uring",
  "crates/api",
  "crates/blob-store",
  "crates/collab",
  "crates/crypto",
  "crates/domain",
  "crates/git-store",
  "crates/persistence",
  "crates/protocol",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.99"

[workspace.dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.100"
argon2 = "0.6.0"
async-stream = "0.3.6"
async-trait = "0.1.89"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
dashmap = "6.1.0"
futures-core = "0.3.31"
git2 = "0.21.0"
hex = "0.4.3"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
prost = "0.14.4"
prost-types = "0.14.4"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring-webpki",
  "postgres",
  "uuid",
  "chrono",
  "migrate",
  "macros",
] }
thiserror = "2.0.17"
tokio = { version = "1.54.0", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-uring = "0.5.0"
tonic = { version = "0.14.6", features = ["transport", "tls-ring", "gzip"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tonic-reflection = "0.14.6"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
zeroize = "1.8.2"
